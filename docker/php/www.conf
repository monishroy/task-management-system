[global]
error_log = /dev/stderr
daemonize = no

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; Pass environment variables to PHP-FPM workers (essential for Coolify / Docker container environments)
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
